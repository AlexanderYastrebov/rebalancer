apiVersion: v1
kind: ServiceAccount
metadata:
  name: rebalancer
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rebalancer
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, watch, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch, patch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rebalancer
subjects:
  - kind: ServiceAccount
    name: rebalancer
    namespace: default
roleRef:
  kind: ClusterRole
  name: rebalancer
  apiGroup: rbac.authorization.k8s.io
